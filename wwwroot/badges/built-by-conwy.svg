<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="720"
  height="180"
  viewBox="0 0 720 180"
  role="img"
  aria-labelledby="badgeTitle badgeDescription">

  <title id="badgeTitle">Built by Conwy bilingual badge</title>
  <desc id="badgeDescription">
    A bilingual Built by and Wedi'i Greu gan badge,
    with a tick on the left and the official Conwy logo on the right.
  </desc>

  <style>
    .english {
      font-family: "Arial", "Helvetica Neue", sans-serif;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: 1.4px;
      fill: #17365d;
    }

    .welsh {
      font-family: "Arial", "Helvetica Neue", sans-serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.35px;
      fill: #42484f;
    }
  </style>

  <!-- White badge with rounded Conwy-blue border -->
  <rect
    x="3"
    y="3"
    width="714"
    height="174"
    rx="20"
    fill="#ffffff"
    stroke="#17365d"
    stroke-width="6" />

  <!-- Tick -->
  <circle
    cx="68"
    cy="90"
    r="34"
    fill="#00843d" />

  <path
    d="M50 90 L63 103 L87 76"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- Bilingual wording -->
  <text
    x="123"
    y="81"
    class="english">
    BUILT BY
  </text>

  <text
    x="123"
    y="115"
    class="welsh">
    WEDI'I GREU GAN
  </text>

  <!-- Divider -->
  <line
    x1="365"
    y1="42"
    x2="365"
    y2="138"
    stroke="#d3d8dc"
    stroke-width="2" />

  <!-- Official Conwy logo (fetched from conwy.gov.uk, embedded so the badge is self-contained -
       native resolution is only 90x58, so it's shown near-native size rather than stretched
       to fill the slot, to avoid a blurry upscale) -->
  <image
    x="488"
    y="55"
    width="109"
    height="70"
    href="data:image/png;base64," />
</svg>
